<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem('theme'); } catch (error) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      }());
    </script>
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
    <script src="{{ '/assets/theme.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title | escape }}<span aria-hidden="true"> /</span></a>
      <div class="header-actions">
        <button class="theme-toggle" type="button" aria-label="Switch to dark mode" hidden>Dark mode</button>
        <a class="repo-link" href="https://github.com/grjus/grjus.github.io">GitHub ↗</a>
      </div>
    </header>
    <main id="content">{{ content }}</main>
    <footer class="site-footer">AI, machine learning, and cloud technology.<br>Research, tools, and developments in one place.</footer>
  </body>
</html>
