<!doctype html>
<html lang="{{ site.lang | default: 'pl' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title | escape }}<span aria-hidden="true"> /</span></a>
      <a class="repo-link" href="https://github.com/grjus/grjus.github.io">GitHub ↗</a>
    </header>
    <main id="content">{{ content }}</main>
    <footer class="site-footer">Badania, narzędzia i praktyka. Każdy wpis z odnośnikami do źródeł.</footer>
  </body>
</html>
