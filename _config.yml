title: AI Signal
description: A three-day briefing on AI agents, research, and cloud infrastructure. Primary sources, practical implications, and clear limitations.
url: https://grjus.github.io
baseurl: ""
lang: en
timezone: Europe/Warsaw
permalink: /:year/:month/:day/:title/
markdown: kramdown
plugins:
  - jekyll-paginate
paginate: 10
paginate_path: /page/:num/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
exclude:
  # Jekyll 3 replaces its default exclusions when this list is set.
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - AGENTS.md
  - README.md
  - docs
  - scripts
  - tests
  - Gemfile
  - Gemfile.lock
